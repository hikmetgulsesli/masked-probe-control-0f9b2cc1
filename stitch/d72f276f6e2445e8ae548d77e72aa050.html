<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Status Utility - Masked Probe Control</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#66748a",
                        "on-primary": "#1500a8",
                        "error": "#ffb4ab",
                        "on-error-container": "#ffdad6",
                        "on-surface-variant": "#c7c4d8",
                        "primary-container": "#5d5cff",
                        "on-primary-fixed": "#09006b",
                        "on-tertiary-fixed-variant": "#3a485c",
                        "outline-variant": "#464556",
                        "tertiary": "#b9c7e0",
                        "surface-dim": "#101415",
                        "on-background": "#e0e3e5",
                        "on-secondary-fixed-variant": "#3c475a",
                        "secondary-fixed": "#d8e3fb",
                        "on-primary-fixed-variant": "#2b20d2",
                        "on-secondary": "#263143",
                        "on-tertiary-fixed": "#0d1c2f",
                        "surface-container-lowest": "#0b0f10",
                        "outline": "#908fa1",
                        "on-primary-container": "#fdf9ff",
                        "on-secondary-fixed": "#111c2d",
                        "surface-container-low": "#191c1e",
                        "secondary-fixed-dim": "#bcc7de",
                        "inverse-surface": "#e0e3e5",
                        "surface-tint": "#c1c1ff",
                        "secondary-container": "#3e495d",
                        "primary-fixed": "#e1dfff",
                        "surface-variant": "#323537",
                        "on-tertiary": "#233144",
                        "surface-container-high": "#272a2c",
                        "primary-fixed-dim": "#c1c1ff",
                        "tertiary-fixed-dim": "#b9c7e0",
                        "on-tertiary-container": "#fafaff",
                        "background": "#101415",
                        "surface-container-highest": "#323537",
                        "error-container": "#93000a",
                        "tertiary-fixed": "#d5e3fd",
                        "surface-container": "#1d2022",
                        "surface-bright": "#363a3b",
                        "inverse-on-surface": "#2d3133",
                        "inverse-primary": "#4643e9",
                        "secondary": "#bcc7de",
                        "on-surface": "#e0e3e5",
                        "on-secondary-container": "#aeb9d0",
                        "primary": "#c1c1ff",
                        "surface": "#101415",
                        "on-error": "#690005"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit": "4px",
                        "max-width": "1440px",
                        "margin-desktop": "32px",
                        "margin-mobile": "16px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "technical-sm": ["JetBrains Mono"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "technical-md": ["JetBrains Mono"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "technical-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "technical-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background dark:bg-background text-on-surface min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background border-b border-outline-variant dark:border-outline-variant flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-unit h-14 shrink-0 fixed top-0 z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="hub">hub</span>
<h1 class="font-headline-sm text-headline-sm font-semibold text-primary dark:text-primary tracking-tight">Masked Probe Control</h1>
</div>
<div class="flex items-center gap-4 hidden"> <!-- Hidden search bar as per JSON -->
<input class="bg-surface-container-high border-outline-variant rounded px-3 py-1 text-on-surface focus:outline-none focus:border-primary" placeholder="Search..." type="text"/>
</div>
<div class="flex items-center gap-3">
<button aria-label="refresh" class="p-2 hover:bg-surface-container-high dark:hover:bg-surface-container-high transition-colors rounded text-on-surface-variant dark:text-on-surface-variant active:scale-95 duration-150 group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors" data-icon="refresh">refresh</span>
</button>
<button aria-label="settings" class="p-2 hover:bg-surface-container-high dark:hover:bg-surface-container-high transition-colors rounded text-on-surface-variant dark:text-on-surface-variant active:scale-95 duration-150 group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors" data-icon="settings">settings</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center pt-14 p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Background Grid Pattern for Technical Feel -->
<div class="absolute inset-0 pointer-events-none opacity-5 bg-[linear-gradient(to_right,#808080_1px,transparent_1px),linear-gradient(to_bottom,#808080_1px,transparent_1px)] bg-[size:32px_32px]"></div>
<!-- Utility Panel -->
<div class="relative w-full max-w-3xl bg-surface-container border border-outline-variant rounded-xl shadow-2xl p-6 md:p-8 flex flex-col gap-8 z-10 backdrop-blur-sm bg-opacity-95">
<!-- Panel Header & Status Toggle -->
<div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 pb-4 border-b border-outline-variant">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-1">System Status</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Real-time telemetrics and probe diagnostics.</p>
</div>
<div class="flex items-center gap-3 bg-surface-container-high px-4 py-2 rounded-lg border border-outline-variant">
<span class="font-label-caps text-label-caps text-on-surface uppercase tracking-wider">System Status</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" id="systemToggle" type="checkbox"/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
<span class="ml-3 font-technical-sm text-technical-sm text-primary" id="toggleLabel">Ready</span>
</label>
</div>
</div>
<!-- Telemetrics Grid -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
<!-- Card 1: Health -->
<div class="bg-surface border border-outline-variant rounded-lg p-5 flex flex-col gap-2 hover:border-primary transition-colors duration-300 relative overflow-hidden group">
<div class="absolute top-0 right-0 w-16 h-16 bg-primary opacity-5 rounded-bl-full group-hover:scale-150 transition-transform duration-500"></div>
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="monitor_heart" data-weight="fill">monitor_heart</span>
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase">Probe Health</h3>
</div>
<div class="flex items-end gap-2">
<span class="font-headline-lg text-headline-lg text-on-surface">100</span>
<span class="font-technical-sm text-technical-sm text-on-surface-variant mb-1">%</span>
</div>
<div class="w-full bg-surface-variant h-1 mt-2 rounded-full overflow-hidden">
<div class="bg-primary h-full rounded-full w-full"></div>
</div>
</div>
<!-- Card 2: Latency -->
<div class="bg-surface border border-outline-variant rounded-lg p-5 flex flex-col gap-2 hover:border-primary transition-colors duration-300 relative overflow-hidden group">
<div class="absolute top-0 right-0 w-16 h-16 bg-primary opacity-5 rounded-bl-full group-hover:scale-150 transition-transform duration-500"></div>
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="speed" data-weight="fill">speed</span>
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase">Network Latency</h3>
</div>
<div class="flex items-end gap-2">
<span class="font-headline-lg text-headline-lg text-on-surface">12</span>
<span class="font-technical-sm text-technical-sm text-on-surface-variant mb-1">ms</span>
</div>
<div class="flex items-center gap-2 mt-2">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="font-technical-sm text-technical-sm text-on-surface-variant">Optimal connection</span>
</div>
</div>
<!-- Card 3: Load -->
<div class="bg-surface border border-outline-variant rounded-lg p-5 flex flex-col gap-2 hover:border-primary transition-colors duration-300 relative overflow-hidden group">
<div class="absolute top-0 right-0 w-16 h-16 bg-primary opacity-5 rounded-bl-full group-hover:scale-150 transition-transform duration-500"></div>
<div class="flex items-center gap-2 mb-1">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="memory" data-weight="fill">memory</span>
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase">System Load</h3>
</div>
<div class="flex items-end gap-2">
<span class="font-headline-lg text-headline-lg text-on-surface">4</span>
<span class="font-technical-sm text-technical-sm text-on-surface-variant mb-1">%</span>
</div>
<div class="w-full bg-surface-variant h-1 mt-2 rounded-full overflow-hidden flex">
<div class="bg-primary h-full rounded-l-full w-[4%]"></div>
<div class="bg-transparent h-full w-[96%]"></div>
</div>
</div>
</div>
<!-- Controls & Feedback -->
<div class="flex flex-col gap-6 mt-4">
<!-- Timestamp Display -->
<div class="flex items-center justify-between bg-surface p-4 rounded-lg border border-outline-variant">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="schedule">schedule</span>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Current Sync Time</span>
</div>
<div class="font-technical-md text-technical-md text-primary tracking-widest bg-surface-container-high px-3 py-1 rounded border border-outline-variant/50 shadow-inner" id="timestampDisplay">
                        --:--:--.---
                    </div>
</div>
<!-- Action Area -->
<div class="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t border-outline-variant">
<div class="flex flex-col gap-1 w-full sm:w-auto">
<button class="bg-primary-container hover:bg-primary text-on-primary-container font-body-md font-semibold py-2.5 px-6 rounded DEFAULT flex items-center justify-center gap-2 transition-all active:scale-95 shadow-lg shadow-primary-container/20" id="refreshBtn">
<span class="material-symbols-outlined text-[18px]" data-icon="sync">sync</span>
                            Refresh Telemetrics
                        </button>
<span class="font-technical-sm text-technical-sm text-on-surface-variant opacity-70 mt-1 pl-1" id="lastUpdateText">Last Update: Pending...</span>
</div>
<!-- Feedback Console -->
<div class="w-full sm:w-auto bg-surface-container-lowest border border-outline-variant rounded p-3 min-w-[200px] flex items-center gap-2 h-[48px]">
<span class="w-2 h-2 rounded-full bg-primary inline-block" id="statusIndicator"></span>
<span class="font-technical-sm text-technical-sm text-on-surface-variant" id="feedbackMessage">Local state active</span>
</div>
</div>
</div>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const timestampDisplay = document.getElementById('timestampDisplay');
            const lastUpdateText = document.getElementById('lastUpdateText');
            const refreshBtn = document.getElementById('refreshBtn');
            const feedbackMessage = document.getElementById('feedbackMessage');
            const statusIndicator = document.getElementById('statusIndicator');
            const systemToggle = document.getElementById('systemToggle');
            const toggleLabel = document.getElementById('toggleLabel');
            const syncIcon = refreshBtn.querySelector('.material-symbols-outlined');

            // Format timestamp for technical display
            function getFormattedTimestamp() {
                const now = new Date();
                return now.toISOString().replace('T', ' ').substring(0, 23) + 'Z';
            }

            // Update running clock
            function updateClock() {
                timestampDisplay.textContent = getFormattedTimestamp();
            }

            setInterval(updateClock, 100); // High precision update

            // Refresh Action
            refreshBtn.addEventListener('click', () => {
                // Visual feedback for button click
                syncIcon.classList.add('animate-spin');
                feedbackMessage.textContent = 'Fetching telemetry...';
                feedbackMessage.classList.remove('text-on-surface-variant', 'text-error');
                feedbackMessage.classList.add('text-primary');
                statusIndicator.classList.remove('bg-error', 'bg-primary');
                statusIndicator.classList.add('bg-primary', 'animate-pulse');

                // Simulate network request delay
                setTimeout(() => {
                    const currentStr = getFormattedTimestamp();
                    lastUpdateText.textContent = `Last Update: ${currentStr}`;
                    syncIcon.classList.remove('animate-spin');
                    
                    // Simulate occasional random error for robust UI testing
                    if(Math.random() > 0.8) {
                        feedbackMessage.textContent = 'Failed to persist status.';
                        feedbackMessage.classList.remove('text-primary');
                        feedbackMessage.classList.add('text-error');
                        statusIndicator.classList.remove('bg-primary', 'animate-pulse');
                        statusIndicator.classList.add('bg-error');
                    } else {
                        feedbackMessage.textContent = 'Telemetry synced successfully.';
                        feedbackMessage.classList.remove('text-primary', 'text-error');
                        feedbackMessage.classList.add('text-on-surface-variant');
                        statusIndicator.classList.remove('animate-pulse', 'bg-error');
                        statusIndicator.classList.add('bg-primary');
                        
                        // Reset to default message after a few seconds
                        setTimeout(() => {
                             if(feedbackMessage.textContent === 'Telemetry synced successfully.'){
                                 feedbackMessage.textContent = 'Local state active';
                             }
                        }, 3000);
                    }
                }, 800);
            });

            // Toggle Action
            systemToggle.addEventListener('change', (e) => {
                if(e.target.checked) {
                    toggleLabel.textContent = 'Ready';
                    toggleLabel.classList.remove('text-on-surface-variant');
                    toggleLabel.classList.add('text-primary');
                    feedbackMessage.textContent = 'System armed.';
                } else {
                    toggleLabel.textContent = 'Paused';
                    toggleLabel.classList.remove('text-primary');
                    toggleLabel.classList.add('text-on-surface-variant');
                    feedbackMessage.textContent = 'System suspended.';
                }
            });
            
            // Initial load state
            lastUpdateText.textContent = `Last Update: ${getFormattedTimestamp()}`;
        });
    </script>
</body></html>
